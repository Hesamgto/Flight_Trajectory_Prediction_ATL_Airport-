name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        paper: [paper1_cg3d_atl, paper2_cnn_gru_comparison]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic sample data
        working-directory: ${{ matrix.paper }}
        run: python src/make_sample_data.py --rows 600 --out data/sample_flight_data.csv

      - name: Smoke-test paper1 models (build + 1 epoch, no crash)
        if: matrix.paper == 'paper1_cg3d_atl'
        working-directory: ${{ matrix.paper }}
        run: |
          for model in cnn gru lstm mlp c3d cnn_gru crc3d crc3d_mc; do
            python src/train.py --data data/sample_flight_data.csv --model "$model" \
              --epochs 1 --batch-size 32 --window-size 10 --output-dir /tmp/ci-results
          done

      - name: Smoke-test paper2 models (build + 1 epoch, no crash)
        if: matrix.paper == 'paper2_cnn_gru_comparison'
        working-directory: ${{ matrix.paper }}
        run: |
          python src/train.py --data data/sample_flight_data.csv --model both \
            --epochs 1 --batch-size 32 --window-size 10 --output-dir /tmp/ci-results
